<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="blender-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tritan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="blender-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#blender-bg)"/>
  <circle cx="200" cy="200" r="140" fill="#1e293b" opacity="0.6"/>
  <!-- Motor Base -->
  <path d="M140 240 L145 330 Q148 340 160 340 L240 340 Q252 340 255 330 L260 240 Z" fill="#334155"/>
  <path d="M148 245 L152 325 Q155 332 165 332 L235 332 Q245 332 248 325 L252 245 Z" fill="#1e293b"/>
  <!-- Pulse Button -->
  <circle cx="200" cy="290" r="18" fill="url(#blender-accent)"/>
  <circle cx="200" cy="290" r="13" fill="#0f172a"/>
  <text x="200" y="295" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="900">PULSE</text>
  <!-- Jar Collar -->
  <rect x="155" y="225" width="90" height="18" rx="4" fill="#475569"/>
  <!-- Transparent Tritan Cup -->
  <path d="M160 225 L168 85 Q170 80 180 80 L220 80 Q230 80 232 85 L240 225 Z" fill="url(#tritan)" stroke="#7dd3fc" stroke-width="2"/>
  <!-- Smoothie Vortex Inside -->
  <path d="M175 140 Q200 120 225 150 Q210 190 200 220 Q190 190 175 140 Z" fill="#ec4899" opacity="0.6"/>
  <!-- Blade -->
  <path d="M180 220 L220 220 L210 212 L190 212 Z" fill="#f8fafc"/>
  <!-- Measurement Markings -->
  <line x1="172" y1="120" x2="182" y2="120" stroke="#bae6fd" stroke-width="2"/>
  <line x1="174" y1="150" x2="182" y2="150" stroke="#bae6fd" stroke-width="2"/>
  <line x1="176" y1="180" x2="182" y2="180" stroke="#bae6fd" stroke-width="2"/>
  <!-- Travel Lid -->
  <path d="M165 80 L168 65 Q170 60 180 60 L220 60 Q230 60 232 65 L235 80 Z" fill="#0f172a"/>
  <rect x="190" y="52" width="20" height="10" rx="3" fill="url(#blender-accent)"/>
  <text x="200" y="375" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">KIRTI NUTRI BLENDER</text>
</svg>
