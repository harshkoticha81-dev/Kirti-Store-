<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="soda-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="matte-black" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fizz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#soda-bg)"/>
  <circle cx="200" cy="200" r="140" fill="#1e293b" opacity="0.6"/>
  <!-- Machine Base -->
  <ellipse cx="200" cy="330" rx="70" ry="18" fill="#0f172a"/>
  <!-- Tall Slender Body -->
  <path d="M165 325 L160 110 Q160 70 200 70 Q240 70 240 110 L235 325 Z" fill="url(#matte-black)"/>
  <!-- Carbonation Head Arc -->
  <path d="M150 95 Q150 60 200 60 Q250 60 250 95 L245 130 Q200 145 155 130 Z" fill="#0f172a"/>
  <!-- Top Carbonation Lever / Button -->
  <rect x="185" y="48" width="30" height="15" rx="5" fill="url(#fizz)"/>
  <!-- Carbonating Bottle In Bay -->
  <rect x="175" y="165" width="50" height="135" rx="20" fill="#38bdf8" fill-opacity="0.2" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="185" y="145" width="30" height="22" rx="4" fill="#64748b"/>
  <!-- Sparkling Fizz Bubbles -->
  <circle cx="190" cy="260" r="4" fill="#6ee7b7" opacity="0.9"/>
  <circle cx="205" cy="245" r="5" fill="#6ee7b7" opacity="0.9"/>
  <circle cx="195" cy="225" r="3" fill="#6ee7b7" opacity="0.9"/>
  <circle cx="210" cy="210" r="4" fill="#6ee7b7" opacity="0.9"/>
  <circle cx="188" cy="195" r="3" fill="#6ee7b7" opacity="0.9"/>
  <circle cx="202" cy="180" r="5" fill="#6ee7b7" opacity="0.9"/>
  <text x="200" y="375" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">KIRTI SODA MAKER</text>
</svg>
